[package]
name = "libretiny-matter-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sebastian Schmidt"]

[lib]
crate-type = ["staticlib"]

[workspace]

[dependencies]
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "7195e2b1f45df94ee1bc63605b7db91a6878b9dc", default-features = false, features = ["rustcrypto", "log", "groups", "case-responder-only", "kv-blob-store-2048"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5", features = ["tick-hz-1_000"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000"] }
critical-section = "1.2"
portable-atomic = { version = "1", features = ["critical-section"] }
heapless = { version = "0.9", features = ["portable-atomic-critical-section"] }
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0

[profile.dev]
panic = "abort"

[profile.release.build-override]
opt-level = 2

[patch.crates-io]
embassy-sync = { path = "vendor/embassy-sync" }

[patch."https://github.com/project-chip/rs-matter"]
rs-matter-codegen = { path = "vendor/rs-matter-codegen" }

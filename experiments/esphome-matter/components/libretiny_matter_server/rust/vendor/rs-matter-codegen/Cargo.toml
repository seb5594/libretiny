[package]
name = "rs-matter-codegen"
version = "0.4.1"
edition = "2021"
authors = ["Kedar Sovani <kedars@gmail.com>", "Ivan Markov", "Project CHIP Authors"]
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - IDL parser and code generation"
repository = "https://github.com/project-chip/rs-matter"
readme = "README.md"
keywords = ["matter", "smart", "smart-home", "IoT"]
categories = ["embedded", "network-programming"]
license = "Apache-2.0"
rust-version = "1.87"

[dependencies]
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
miette = { version = "7", features = ["fancy"] }
nom = "7"
nom-greedyerror = "0.5"
nom-supreme = "0.8"
nom_locate = "4.2"
convert_case = "0.6"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
assert-tokenstreams-eq = "0.1.0"
rstest = "0.26"
tracing-subscriber = { version = "0.3", features = ["regex", "json"] }

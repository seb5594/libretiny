esphome:
  name: ${device_name}

external_components:
  - source:
      type: local
      path: ../components
    components: [libretiny_matter_probe]

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

# No API, web server, BLE or OTA in this minimal measurement image.
libretiny_matter_probe:
  update_interval: 30s
